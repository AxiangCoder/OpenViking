# OpenViking 产品化平台反向代理（14 号计划 §99.1 P5-E1，06 §16.2 路由表）
#
# 公网路由表：
#   /、/login、/app/*、/admin/*、/platform/*、/oauth/consent、/oauth/verify
#       → openviking-product-server（web-platform SPA，同源）
#   /api/platform/v1/*               → Platform Router（同源）
#   /api/v1/*、/mcp、OAuth 协议端点  → OpenViking
#   /studio/*                        → 公网不注册（404；应用层默认也不挂载）
#
# 低层入口 deny 第二道防线（06 §16.3）：应用层条件挂载 + 本层路径 deny 双保险。
#   /api/v1/admin/*  仅内网/VPN（trusted 不暴露公网）
#   WebDAV/Snapshot/Pack/Debug/Observer/Console/系统修复 → 公网 404
#
# 生产全站 HTTPS：443 server 块需证书；HTTP 80 仅做健康检查与 301 跳转。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    # 生产启用 HTTPS 后：
    # location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 生产证书挂载路径（见 docker-compose.yml 注释）：
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ── 低层运维入口 deny（第二道防线；应用层开关为第一道）──
    location ~ ^/api/v1/admin(/|$) { return 404; }
    location ~ ^/api/v1/(console|snapshot|pack|debug|observer)(/|$) { return 404; }
    location ~ ^/webdav(/|$) { return 404; }
    location ~ ^/api/v1/system(/|$)(?=.*(repair|rebuild)) { return 404; }
    location ~ ^/studio(/|$) { return 404; }

    # ── 产品 API（同源）──
    location /api/platform/v1/ {
        proxy_pass http://openviking-product-server:1933;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300s;
    }

    # ── OpenViking 原生 /api/v1、/mcp 与 OAuth 协议端点 ──
    location /api/v1/ {
        proxy_pass http://openviking-product-server:1933;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }
    location /mcp {
        proxy_pass http://openviking-product-server:1933;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
    location ~ ^/\.well-known/oauth-protected-resource { 
        proxy_pass http://openviking-product-server:1933;
        proxy_set_header Host $host;
    }
    location ~ ^/oauth/(authorize|register|token|authorize/page|authorize/page/status) {
        proxy_pass http://openviking-product-server:1933;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── web-platform SPA（/、/login、/app/*、/admin/*、/platform/*、
    #     /oauth/consent、/oauth/verify 同源入口页）──
    location / {
        proxy_pass http://openviking-product-server:1933;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
