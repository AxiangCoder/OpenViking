# Platform migrations Alembic 配置（复用 spike `migrations/` async 示范）。

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../../..

# 运行时 URL 由 env.py 决定：优先 alembic 配置（测试注入），
# 否则取 OV_PLATFORM_DATABASE_URL / PlatformConfig 默认。
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
